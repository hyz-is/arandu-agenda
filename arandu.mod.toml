# What this package declares about itself.
#
# The declaration is capability, not intent: the package's own suite compares it
# with what the code calls, because `aru doctor` reads the application and never
# opens an installed package.

name = "hyz-is/agenda"
framework = ">= 0.67"
profiles = ["conventional", "performance"]

[permissions]
# It answers requests and reads its own rows. Nothing leaves the process: a
# reminder, a confirmation and a cancellation are the application's Notifier's
# to send, and a payment is the application's to take. The package sends no
# message and charges nobody.
network = false
# It opens no file of its own. It keeps no state outside the database.
filesystem = false
# It runs no other program.
exec = false
# migrations.go owns five tables (the services, the weekly hours, the closures,
# the bookings and the protocol counter), so whoever installs this has to run
# `aru migrate`. Declaring it is how they find that out before deploying.
migrations = true
